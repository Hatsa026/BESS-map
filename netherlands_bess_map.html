<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netherlands BESS Opportunity Map | Station-Level Congestion Analysis 2025</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#0b1520; color:#dce8f4; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

#header {
  background:linear-gradient(135deg,#0a1e30 0%,#122d48 100%);
  padding:11px 20px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:2px solid #1a5a8a;
  flex-shrink:0;
}
#header h1 { font-size:16px; font-weight:700; color:#fff; }
#header .sub { font-size:10px; color:#6aabcf; margin-top:2px; }
.badge { background:#d44a30; color:#fff; font-size:9px; font-weight:800; padding:3px 10px; border-radius:10px; letter-spacing:0.6px; white-space:nowrap; }

#main { display:flex; flex:1; overflow:hidden; }
#map { flex:1; }

/* SIDEBAR */
#sidebar {
  width:320px; background:#0a1824;
  display:flex; flex-direction:column;
  border-left:1px solid #14304a;
  flex-shrink:0; overflow:hidden;
}

.sb-section { padding:12px 15px; border-bottom:1px solid #14304a; flex-shrink:0; }
.sb-section h3 { font-size:9px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:#4a9fd4; margin-bottom:8px; }

/* Toggle */
.tog { display:flex; align-items:center; gap:8px; margin-bottom:5px; cursor:pointer; }
.tog input { display:none; }
.tslider { width:28px; height:14px; border-radius:7px; background:#1a3550; position:relative; transition:.2s; flex-shrink:0; }
.tslider::after { content:''; width:10px; height:10px; border-radius:50%; background:#2a5575; position:absolute; top:2px; left:2px; transition:.2s; }
.tog input:checked+.tslider { background:#1a6fa8; }
.tog input:checked+.tslider::after { left:16px; background:#fff; }
.tlabel { font-size:11px; color:#8ab4cc; }

/* Ranking list */
#ranking-list { flex:1; overflow-y:auto; padding:0; }
#ranking-list::-webkit-scrollbar { width:3px; }
#ranking-list::-webkit-scrollbar-thumb { background:#1a3550; }

.rank-item {
  display:flex; align-items:center; gap:0;
  padding:7px 15px; border-bottom:1px solid #0f2338;
  cursor:pointer; transition:background .15s;
}
.rank-item:hover { background:#0f2438; }
.rank-item.active { background:#112a3a; border-left:3px solid #4ab8ff; }
.rank-num { font-size:10px; font-weight:800; color:#2a5a7a; width:20px; flex-shrink:0; }
.rank-bar-wrap { flex:1; min-width:0; }
.rank-name { font-size:11px; font-weight:700; color:#cce4f8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
.rank-meta { font-size:9px; color:#4a7a9a; }
.rank-bar-bg { height:4px; background:#0d2233; border-radius:2px; margin-top:3px; }
.rank-bar-fill { height:4px; border-radius:2px; }
.rank-score { font-size:13px; font-weight:800; width:32px; text-align:right; flex-shrink:0; }

/* Detail panel */
#detail-panel {
  flex-shrink:0; background:#091520;
  border-top:1px solid #14304a;
  overflow-y:auto; max-height:44%;
  padding:12px 15px;
}
#detail-panel::-webkit-scrollbar { width:3px; }
#detail-panel::-webkit-scrollbar-thumb { background:#1a3550; }
.dp-title { font-size:14px; font-weight:800; color:#fff; margin-bottom:2px; }
.dp-kv { font-size:10px; color:#4a9fd4; margin-bottom:10px; }
.dp-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #0f2336; font-size:11px; }
.dp-row .lbl { color:#5a8aaa; }
.dp-row .val { color:#c8e0f8; font-weight:600; font-size:12px; }
.dp-bar { margin:6px 0 2px; }
.dp-bar-lbl { font-size:9px; color:#4a7a9a; text-transform:uppercase; letter-spacing:.7px; margin-bottom:2px; }
.dp-bar-bg { background:#0a1e30; height:7px; border-radius:3px; }
.dp-bar-fill { height:7px; border-radius:3px; }
.dp-notes { margin-top:9px; font-size:10px; color:#6a9ab8; line-height:1.65; background:#070f18; padding:9px; border-radius:5px; border-left:3px solid #1a5a8a; }
.dp-placeholder { font-size:11px; color:#2a5a7a; line-height:1.75; }
.sbadge { display:inline-block; padding:1px 7px; border-radius:8px; font-size:9px; font-weight:800; letter-spacing:.3px; margin-bottom:8px; }
.s-crit { background:#5a1414; color:#ff8080; }
.s-high { background:#4a2a00; color:#ffaa40; }
.s-mh   { background:#2a3a00; color:#c0e040; }
.s-med  { background:#003a28; color:#50e0a0; }

/* Stats bar */
#stats { background:#06111a; padding:6px 20px; display:flex; gap:28px; border-top:1px solid #10283c; flex-shrink:0; }
.stat { text-align:center; }
.sval { font-size:14px; font-weight:800; color:#4ab8ff; }
.slbl { font-size:8px; color:#2a5a7a; letter-spacing:.8px; text-transform:uppercase; }

/* Legend */
.leg-row { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:10px; color:#7aaccc; }
.leg-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.leg-ring { width:14px; height:14px; border-radius:50%; border:2px solid; flex-shrink:0; background:transparent; }

/* Leaflet overrides */
.leaflet-container { background:#0b1520; }
.leaflet-control-zoom { border:1px solid #14304a !important; }
.leaflet-control-zoom a { background:#0a1824 !important; color:#4ab8ff !important; border-color:#14304a !important; }
.leaflet-control-zoom a:hover { background:#112a3a !important; }
.leaflet-popup-content-wrapper { background:#091a2a; border:1px solid #1a5a8a; color:#cce4f8; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.6); }
.leaflet-popup-tip { background:#091a2a; }
.leaflet-popup-close-button { color:#4ab8ff !important; }
.leaflet-tooltip { background:transparent !important; border:none !important; box-shadow:none !important; padding:0 !important; }
.ctt { background:#091a2a; border:1px solid #1a5a8a; border-radius:6px; padding:7px 11px; font-size:11px; color:#cce4f8; min-width:140px; box-shadow:0 3px 12px rgba(0,0,0,.5); }
.ctt strong { color:#fff; font-size:12px; display:block; margin-bottom:2px; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Netherlands BESS Station-Level Congestion Map</h1>
    <div class="sub">Per-station congestion scoring</div>
  </div>
  <div class="badge">BESS TOOL</div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="sidebar">

    <div class="sb-section">
      <h3>Layers</h3>
    </div>

    <div id="ranking-list"></div>

    <div id="detail-panel">
      <div class="dp-placeholder">
        Click a station on the map to see its analysis.
      </div>
    </div>

  </div>
</div>

<div id="stats">
  <div class="stat"><div class="sval" id="stat-total">36</div><div class="slbl">Stations</div></div>
</div>

<script>
const STATIONS = [];
const RENEWABLES = [];
let map = null;

document.addEventListener('DOMContentLoaded', init);
function init() {
  map = L.map('map').setView([52.1, 5.3], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
}
</script>
</body>
</html>
